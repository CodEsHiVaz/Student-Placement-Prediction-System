{% extends "base.html" %}
{% block title %}Register · PlacementAI{% endblock %}
{% block content %}
<div class="auth-brand">
  <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
  Placement<span class="brand-accent">AI</span>
</div>

<div class="auth-card">
  <h4 class="mb-1">Create your account</h4>
  <p class="auth-sub mb-4">Register as a student to run placement predictions.</p>

  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" minlength="6" required>
      <div class="form-text">At least 6 characters.</div>
    </div>
    <div class="mb-4">
      <label class="form-label">Confirm Password</label>
      <input type="password" name="confirm_password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Create account</button>
  </form>

  <p class="text-center mt-4 mb-0 auth-sub">
    Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
  </p>
</div>
{% endblock %}
