{% extends "base.html" %}
{% block title %}Login · PlacementAI{% endblock %}
{% block content %}
<div class="auth-brand">
  <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
  Placement<span class="brand-accent">AI</span>
</div>

<div class="auth-card">
  <h4 class="mb-1">Welcome back</h4>
  <p class="auth-sub mb-4">Sign in to your account to continue.</p>

  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Sign in</button>
  </form>

  <p class="text-center mt-4 mb-0 auth-sub">
    Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
  </p>
</div>
{% endblock %}
