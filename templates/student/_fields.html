{# Reusable student feature inputs. Expects: student, gender_options,
   degree_options, branch_options, ranges. Values prefilled from `student`. #}
{% macro val(field) %}{{ student[field] if student and student[field] is not none else '' }}{% endmacro %}

<div class="row g-3">
  <div class="col-md-4">
    <label class="form-label">Age</label>
    <input type="number" id="age" name="age" class="form-control" required
           min="{{ ranges.age[0] }}" max="{{ ranges.age[1] }}" value="{{ val('age') }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Gender</label>
    <select id="gender" name="gender" class="form-select" required>
      <option value="">Select...</option>
      {% for g in gender_options %}
        <option value="{{ g }}" {{ 'selected' if student and student.gender == g }}>{{ g }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Degree</label>
    <select id="degree" name="degree" class="form-select" required>
      <option value="">Select...</option>
      {% for d in degree_options %}
        <option value="{{ d }}" {{ 'selected' if student and student.degree == d }}>{{ d }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Branch</label>
    <select id="branch" name="branch" class="form-select" required>
      <option value="">Select...</option>
      {% for b in branch_options %}
        <option value="{{ b }}" {{ 'selected' if student and student.branch == b }}>{{ b }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">CGPA (0-10)</label>
    <input type="number" step="0.01" id="cgpa" name="cgpa" class="form-control" required
           min="{{ ranges.cgpa[0] }}" max="{{ ranges.cgpa[1] }}" value="{{ val('cgpa') }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Aptitude Test Score (0-100)</label>
    <input type="number" id="aptitude_test_score" name="aptitude_test_score" class="form-control" required
           min="{{ ranges.aptitude_test_score[0] }}" max="{{ ranges.aptitude_test_score[1] }}"
           value="{{ val('aptitude_test_score') }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Coding Skills (0-10)</label>
    <input type="number" id="coding_skills" name="coding_skills" class="form-control" required
           min="{{ ranges.coding_skills[0] }}" max="{{ ranges.coding_skills[1] }}" value="{{ val('coding_skills') }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Communication Skills (0-10)</label>
    <input type="number" id="communication_skills" name="communication_skills" class="form-control" required
           min="{{ ranges.communication_skills[0] }}" max="{{ ranges.communication_skills[1] }}"
           value="{{ val('communication_skills') }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Soft Skills Rating (0-10)</label>
    <input type="number" id="soft_skills_rating" name="soft_skills_rating" class="form-control" required
           min="{{ ranges.soft_skills_rating[0] }}" max="{{ ranges.soft_skills_rating[1] }}"
           value="{{ val('soft_skills_rating') }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Internships</label>
    <input type="number" id="internships" name="internships" class="form-control" required
           min="{{ ranges.internships[0] }}" max="{{ ranges.internships[1] }}" value="{{ val('internships') }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Projects</label>
    <input type="number" id="projects" name="projects" class="form-control" required
           min="{{ ranges.projects[0] }}" max="{{ ranges.projects[1] }}" value="{{ val('projects') }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Certifications</label>
    <input type="number" id="certifications" name="certifications" class="form-control" required
           min="{{ ranges.certifications[0] }}" max="{{ ranges.certifications[1] }}" value="{{ val('certifications') }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Backlogs</label>
    <input type="number" id="backlogs" name="backlogs" class="form-control" required
           min="{{ ranges.backlogs[0] }}" max="{{ ranges.backlogs[1] }}" value="{{ val('backlogs') }}">
  </div>
</div>
